<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sim3</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>sim3</h1>
    <div class="clock">
      <span id="date" class="date">—</span>
      <span id="elapsed" class="elapsed"></span>
    </div>
    <div class="controls">
      <button id="toggle" type="button">Play</button>
      <button id="step-day" type="button" title="Advance one day">+1 day</button>
      <button id="step-month" type="button" title="Advance one month">+1 month</button>
      <button id="step-year" type="button" title="Advance one year">+1 year</button>
      <select id="speed" title="Speed"></select>
      <span id="rate" class="rate"></span>
    </div>
    <label class="run">Run
      <select id="run" title="Kind of run">
        <option value="holocene">From 10,000 BCE</option>
        <option value="present_day_check">Present-day check</option>
      </select>
    </label>
    <span id="connection" class="status">connecting…</span>
  </header>

  <div class="body">
    <main class="map-area">
      <canvas id="map"></canvas>
      <div id="map-loading" class="map-loading">Loading the world map…</div>

      <div class="panel map-options">
        <div class="option-group" id="epochs" role="group" aria-label="Moment shown"></div>
        <div class="option-group" id="layers" role="group" aria-label="Map layer"></div>
        <div class="option-group" id="temp-options" role="group" aria-label="What the layer shows" hidden></div>
        <div class="option-group"><button id="winds-toggle" type="button" aria-pressed="false">Winds this month</button><button id="currents-toggle" type="button" aria-pressed="false">Ocean currents</button><button id="world-toggle" type="button" aria-pressed="false">World temperature</button></div>
      </div>

      <div class="panel chart-panel" id="cell-chart" hidden></div>
      <div class="panel chart-panel world" id="world-chart" hidden></div>

      <div class="panel hover" id="hover" hidden></div>
      <div class="panel legend" id="legend"></div>
      <div class="panel map-help">Drag to pan · scroll to zoom</div>
    </main>

    <aside class="chronicle">
      <section id="check" class="check" hidden>
        <h2>Present-day check</h2>
        <div id="check-body"></div>
      </section>
      <h2>Chronicle</h2>
      <ol id="events"></ol>
    </aside>
  </div>

  <script src="/map.js"></script>
  <script src="/app.js"></script>
</body>
</html>
