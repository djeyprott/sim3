name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download world data
        shell: bash
        run: |
          mkdir -p data
          curl -fsSL --retry 3 -o data/world.bin \
            "https://github.com/${{ github.repository }}/releases/download/world-data-v$(tr -d '[:space:]' < tools/data/VERSION)/world.bin"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
