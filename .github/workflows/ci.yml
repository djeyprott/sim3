name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download world data
        shell: bash
        run: |
          mkdir -p data
          # Use the data version in tools/data/VERSION; while a new version is
          # still being built by the data workflow, fall back to the previous one.
          v=$(tr -d '[:space:]' < tools/data/VERSION)
          until curl -fsSL --retry 3 -o data/world.bin \
            "https://github.com/${{ github.repository }}/releases/download/world-data-v$v/world.bin"; do
            v=$((v - 1)); [ "$v" -ge 1 ] || exit 1
            echo "falling back to world-data-v$v"
          done
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
