name: Release

# On every push to main: if the workspace version in Cargo.toml has no
# release yet, build sim3.exe on Windows and publish it as release v<version>.
# To ship a new download, bump `version` under [workspace.package].
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already released
        id: version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if gh release view "v${version}" > /dev/null 2>&1; then
            echo "v${version} is already released; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.exists == 'false'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.version.outputs.exists == 'false'
        name: Download world data
        run: |
          mkdir -p data
          curl -fsSL --retry 3 -o data/world.bin \
            "https://github.com/${{ github.repository }}/releases/download/world-data-v$(tr -d '[:space:]' < tools/data/VERSION)/world.bin"
      - if: steps.version.outputs.exists == 'false'
        run: cargo build --release --bin sim3
      - if: steps.version.outputs.exists == 'false'
        name: Publish release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" target/release/sim3.exe \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "Download sim3.exe and double-click it. See the README for details."
