name: Data probe

# Temporary: checks new data sources from GitHub's machines. Removed once
# the data workflow uses them.
on:
  push:
    branches: [main]
    paths: [".github/workflows/data-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          pip install --quiet rasterio
          for u in \
            https://www.ncei.noaa.gov/pub/data/paleo/climate_forcing/orbital_variations/insolation/orbit91 \
            https://www.ncei.noaa.gov/pub/data/paleo/icecore/antarctica/antarctica2015co2composite.txt \
            https://gml.noaa.gov/webdata/ccgg/trends/co2/co2_annmean_mlo.txt ; do
            echo "=== $u"
            curl -fsSL --max-time 120 -o f.txt "$u"; echo "exit $?"
            head -c 1500 f.txt | grep -v "^#" | head -12
            grep -c . f.txt
          done
          grep -v "^#" f.txt | awk '$1>=1981 && $1<=2010' | head -3
          for u in \
            https://os.zhdk.cloud.switch.ch/chelsav2/GLOBAL/climatologies/1981-2010/tas/CHELSA_tas_01_1981-2010_V.2.1.tif \
            https://os.zhdk.cloud.switch.ch/envicloud/chelsa/chelsa_V2/GLOBAL/climatologies/1981-2010/tas/CHELSA_tas_01_1981-2010_V.2.1.tif ; do
            echo "=== $u"
            curl -sIL --max-time 60 "$u" | grep -iE "^(HTTP|content-length)"
          done
          curl -fsSL -o t.tif https://os.zhdk.cloud.switch.ch/chelsav2/GLOBAL/climatologies/1981-2010/tas/CHELSA_tas_01_1981-2010_V.2.1.tif && python - <<'PY'
          import rasterio, numpy as np
          from rasterio.windows import Window
          with rasterio.open("t.tif") as f:
              print(f.width, f.height, f.dtypes, f.nodata, f.scales, f.offsets, f.transform, f.bounds, f.block_shapes)
              a = f.read(1, window=Window(20000, 4000, 400, 400))
              print("sample", a.min(), a.max(), np.median(a))
          PY
