name: Data probe

# Temporary: checks which raw datasets can be downloaded from GitHub's
# machines. Removed once the real data workflow exists.
on:
  push:
    branches: [main]
    paths: [".github/workflows/data-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look for GLAC-1D ice thickness
        run: |
          set +e
          for u in \
            "https://www.physics.mun.ca/~lev/dataAccess.html" \
            "https://pmip4.lsce.ipsl.fr/doku.php/data:ice_glac_1d" ; do
            curl -sL --max-time 60 -o probe.bin -w "%{http_code} %{size_download} %{content_type} $u\n" "$u"
            grep -oE 'href="[^"]+"' probe.bin | grep -viE "\.(css|js|png|svg|ico)|doku.php\?|/lib/" | head -150
          done
